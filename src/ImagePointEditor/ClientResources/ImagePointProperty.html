<div class="dijitInline">
    <div style="position:relative;top:0;left:0;border: 1px solid #cdd2d3;">
        <img src="" alt="" style="position: relative; top: 0; left: 0; min-width:200px; max-width: 400px; cursor:crosshair;" data-dojo-attach-point="previewImage" data-dojo-attach-event="onclick:_setNewPosition,onload:_previewImageLoaded" />
        <div class="ipdot" data-dojo-attach-point="dotImage"></div>
        <div style="padding:2px 10px; font-size:smaller; text-align: right; border-top: 1px solid #cdd2d3;">
            <div style="float:left; padding: 2px 0;">Click image to place point</div>
            <div style="padding: 2px 10px 0; display: inline-block;" data-dojo-attach-point="info"></div>
            <div title="Remove point" class="dijitReset dijitInline dijitIcon epi-iconTrash" style="cursor: pointer;" data-dojo-attach-event="onclick:_resetPosition"></div>
            <div style="clear:both"></div>
        </div>
    </div>
</div>
